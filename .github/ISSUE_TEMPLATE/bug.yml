name: Bug report
description: Something isn't working the way the docs say it should
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: Extension version, placeholder: "e.g. 0.10.6 - the Extensions panel shows it"}
    validations: {required: true}
  - type: dropdown
    id: editor
    attributes:
      label: Editor
      options: [VS Code, Antigravity, Cursor, Other]
    validations: {required: true}
  - type: input
    id: os
    attributes: {label: Operating system, placeholder: "Windows 11 / macOS 15 (Apple Silicon) / Ubuntu 24"}
    validations: {required: true}
  - type: textarea
    id: what
    attributes: {label: What happened, description: "What you did, what you expected, what happened instead."}
    validations: {required: true}
  - type: textarea
    id: log
    attributes: {label: "Output log (View > Output > pick the extension)", description: "Paste the relevant lines - the log narrates every decision and usually names the cause.", render: text}
